name: 1 – Blog-Beitrag erstellen (automatisch montags)

on:
  schedule:
    - cron: '*/5 8-16 * * 1'  # Jeden Montag alle 5 Min von 10:00–18:00 Uhr DE (Sommer)
    - cron: '*/5 9-16 * * 1'  # Jeden Montag alle 5 Min von 10:00–17:00 Uhr DE (Winter)
  workflow_dispatch:            # Auch manuell startbar

concurrency:
  # Alle Cron-Läufe teilen sich eine Gruppe und laufen nacheinander (nicht parallel),
  # damit die Duplikat-Prüfung unten zuverlässig greift und nur EINE Freigabe-Mail verschickt wird.
  # Manuelle Läufe (workflow_dispatch) bekommen ihre eigene Gruppe und werden nicht blockiert.
  group: weekly-blog-post-${{ github.event_name == 'schedule' && 'cron' || github.run_id }}
  cancel-in-progress: false

jobs:
  duplikat-check:
    name: Bereits heute gelaufen?
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: check
        run: |
          TODAY=$(TZ="Europe/Berlin" date +%Y-%m-%d)
          COUNT=$(git log --oneline --after="${TODAY}T00:00:00" -- tools/draft_meta.json | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "Heute bereits gelaufen – überspringe zweiten Trigger."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  erstellen:
    name: Beitrag mit KI erstellen
    needs: duplikat-check
    if: needs.duplikat-check.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install anthropic requests playwright pillow

      - name: "Panel: Nadine startet"
        env:
          PANEL_WORKER_URL: ${{ secrets.PANEL_WORKER_URL }}
          PANEL_SYNC_SECRET: ${{ secrets.PANEL_SYNC_SECRET }}
        run: python tools/panel_heartbeat.py nadine "schreibt den Blog-Beitrag und die Instagram-Caption"

      - name: Blog-Beitrag generieren
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python tools/generate_post.py

      - name: Playwright Chromium installieren
        run: playwright install chromium --with-deps

      - name: "Panel: Jonas startet"
        env:
          PANEL_WORKER_URL: ${{ secrets.PANEL_WORKER_URL }}
          PANEL_SYNC_SECRET: ${{ secrets.PANEL_SYNC_SECRET }}
        run: python tools/panel_heartbeat.py jonas "erstellt die Social-Media-Bilder"

      - name: Social-Media-Bild rendern
        run: python tools/generate_social_image.py

      - name: "Panel: Status leeren (wartet jetzt auf Daniels Freigabe)"
        if: always()
        env:
          PANEL_WORKER_URL: ${{ secrets.PANEL_WORKER_URL }}
          PANEL_SYNC_SECRET: ${{ secrets.PANEL_SYNC_SECRET }}
        run: python tools/panel_heartbeat.py clear

      - name: Entwurf ins Repository committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin master
          git stash pop
          git add blog/posts/ tools/draft_meta.json social/latest-ig.html social/latest-ig.png social/latest-ig-heiko.html social/latest-ig-heiko.png social/latest-ig-beide.html social/latest-ig-beide.png social/latest-ig-clean.png
          TITLE=$(python3 -c "import json; print(json.load(open('tools/draft_meta.json'))['title'])")
          git commit -m "Blog-Entwurf: $TITLE"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push-Versuch $i fehlgeschlagen, warte 15 Sekunden..."
            sleep 15
          done

      - name: Regelkreis - Herr Brandt prüft, Nadine bessert bei Bedarf nach (max. 3 Versuche)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PANEL_WORKER_URL: ${{ secrets.PANEL_WORKER_URL }}
          PANEL_SYNC_SECRET: ${{ secrets.PANEL_SYNC_SECRET }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO_NUMBER: ${{ secrets.WHATSAPP_TO_NUMBER }}
        run: python tools/pr_loop.py

      - name: "Panel: Status leeren"
        if: always()
        env:
          PANEL_WORKER_URL: ${{ secrets.PANEL_WORKER_URL }}
          PANEL_SYNC_SECRET: ${{ secrets.PANEL_SYNC_SECRET }}
        run: python tools/panel_heartbeat.py clear

      - name: Änderungen aus der Nachbesserung committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git stash --include-untracked
            STASHED=1
          else
            STASHED=0
          fi
          git pull --rebase origin master
          if [ "$STASHED" -eq 1 ]; then
            git stash pop
          fi
          git add blog/posts/ tools/draft_meta.json
          git diff --staged --quiet || git commit -m "Entwurf von Herrn Brandts Regelkreis nachgebessert"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push-Versuch $i fehlgeschlagen, warte 15 Sekunden..."
            sleep 15
          done

      - name: Metadaten für Benachrichtigung vorbereiten
        run: |
          TITLE=$(python3 -c "import json; m=json.load(open('tools/draft_meta.json')); print(m['title'])")
          DATE=$(python3 -c "import json; m=json.load(open('tools/draft_meta.json')); print(m['date_de'])")
          echo "POST_TITLE=$TITLE" >> $GITHUB_ENV
          echo "POST_DATE=$DATE" >> $GITHUB_ENV
          INSTA=$(python3 -c "import json; m=json.load(open('tools/draft_meta.json')); print(m['instagram_caption'])")
          INSTA_SAFE=$(echo "$INSTA" | tr -d '\n\r' | sed 's/"/\\"/g')
          echo "POST_INSTA=$INSTA_SAFE" >> $GITHUB_ENV

      - name: Freigabe-Nachricht per WhatsApp senden
        env:
          WA_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WA_TO: ${{ secrets.WHATSAPP_TO_NUMBER }}
          APPROVE_WORKER_URL: ${{ secrets.APPROVE_WORKER_URL }}
          APPROVE_TOKEN: ${{ secrets.APPROVE_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, json, requests as req, sys

          def trunc(s, n):
            """Kuerzt an der letzten Wortgrenze statt hart mitten im Wort abzuschneiden."""
            s = (s or "").replace("\n", " ").strip()
            if len(s) <= n:
              return s
            cut = s[:n].rsplit(" ", 1)[0].rstrip(",.;:–-")
            return cut + "…"

          meta    = json.load(open("tools/draft_meta.json", encoding="utf-8"))
          title   = meta.get("title", "")
          date_de = meta.get("date_de", "")
          # WhatsApp-Template-Parameter duerfen KEINE Zeilenumbrueche enthalten (Meta lehnt den
          # Versand sonst mit Fehler 132018 ab) - deshalb excerpt/fb/ig als 3 GETRENNTE Parameter
          # (jeweils eigene Zeile im STATISCHEN Vorlagentext, nicht im Parameterwert selbst).
          excerpt    = trunc(meta.get("blog_excerpt", ""), 220)
          fb_preview = trunc(meta.get("social_summary", ""), 180)
          ig_preview = trunc(meta.get("instagram_caption", "").split("\n\n")[0], 180)
          # Fallback fuer das alte kombinierte Template: nur solange nutzen, bis blog_entwurf_info_v2
          # freigegeben ist. Dort ist wegen der 3 mit reingepackten Link-URLs nicht genug Platz fuer
          # excerpt+FB+IG komplett - FB/IG muessen laut Vorgabe VOLLSTAENDIG erscheinen, deshalb faellt
          # hier der Excerpt weg statt FB/IG anzuschneiden.
          summary = f"📘 Facebook: {fb_preview} • 📸 Instagram: {ig_preview}"
          og_image = meta.get("og_image", "")

          repo        = os.environ.get("GITHUB_REPOSITORY", "")
          worker_url  = os.environ.get("APPROVE_WORKER_URL", "").strip().rstrip("/")
          approve_tok = os.environ.get("APPROVE_TOKEN", "").strip()
          if worker_url and approve_tok:
            # Ein-Klick-Links (siehe tools/approve-worker.js) – funktionieren ohne GitHub-Login,
            # ideal am Handy: kein Tab-Wechsel, kein "Run workflow"-Dropdown.
            approve_url      = f"{worker_url}/approve?token={approve_tok}"
            change_url       = f"{worker_url}/change?token={approve_tok}"
            suggest_img_url  = f"{worker_url}/suggest-image?token={approve_tok}"
          else:
            # Fallback, solange der Worker noch nicht eingerichtet ist.
            approve_url      = f"https://github.com/{repo}/actions/workflows/publish-blog-post.yml"
            change_url       = f"https://github.com/{repo}/actions/workflows/request-changes.yml"
            suggest_img_url  = change_url

          token    = os.environ.get("WA_TOKEN", "").strip()
          phone_id = os.environ.get("WA_PHONE_ID", "").strip()
          wa_to    = os.environ.get("WA_TO", "").strip()
          if not all([token, phone_id, wa_to]):
            print("❌ Fehlende WhatsApp-Secrets!"); sys.exit(1)

          msg_api = f"https://graph.facebook.com/v19.0/{phone_id}/messages"
          auth_headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          # Vorschau-Bild vorab senden (bereits freigegebenes Template, kein neues Approval noetig).
          # Erst hochladen und per media-id senden statt per "link" - "link" wird von Meta
          # asynchron nachgeladen und schlaegt dabei manchmal unbemerkt fehl (Status bleibt trotzdem
          # 200); der Upload-Weg ist derselbe zuverlaessige Mechanismus wie bei den Social-Bildern
          # in publish-blog-post.yml/wa-images.yml.
          if og_image:
            img_r = req.get(og_image, timeout=20, headers={"User-Agent": "Mozilla/5.0"})
            if img_r.ok:
              up = req.post(f"https://graph.facebook.com/v19.0/{phone_id}/media",
                headers={"Authorization": f"Bearer {token}"},
                data={"messaging_product": "whatsapp"},
                files={"file": ("vorschau.jpg", img_r.content, img_r.headers.get("content-type", "image/jpeg"))})
              media_id = up.json().get("id") if up.status_code < 300 else None
              print(f"Vorschau-Bild Upload: {up.status_code}{' (' + str(len(img_r.content)//1024) + ' KB)' if media_id else ' ' + up.text[:200]}")
              if media_id:
                r_img = req.post(msg_api, headers=auth_headers, json={
                  "messaging_product": "whatsapp",
                  "to": wa_to,
                  "type": "template",
                  "template": {
                    "name": "social_bild",
                    "language": {"code": "de"},
                    "components": [{"type": "header", "parameters": [
                      {"type": "image", "image": {"id": media_id}}
                    ]}]
                  }
                })
                print(f"Vorschau-Bild Status: {r_img.status_code}")
                if r_img.status_code >= 300:
                  print(f"  (kein Abbruch) Fehler: {r_img.text[:300]}")
            else:
              print(f"Vorschau-Bild Download fehlgeschlagen: {img_r.status_code}")

          def sende_freigabe(template_name, mit_summary):
            params = [
              {"type": "text", "text": title},
              {"type": "text", "text": date_de},
            ]
            if mit_summary:
              params.append({"type": "text", "text": summary})
            params += [
              {"type": "text", "text": approve_url},
              {"type": "text", "text": suggest_img_url},
              {"type": "text", "text": change_url},
            ]
            return req.post(msg_api, headers=auth_headers, json={
              "messaging_product": "whatsapp",
              "to": wa_to,
              "type": "template",
              "template": {
                "name": template_name,
                "language": {"code": "de"},
                "components": [{"type": "body", "parameters": params}]
              }
            })

          def sende_aktion_button(label, url_suffix):
            return req.post(msg_api, headers=auth_headers, json={
              "messaging_product": "whatsapp",
              "to": wa_to,
              "type": "template",
              "template": {
                "name": "blog_aktion",
                "language": {"code": "de"},
                "components": [
                  {"type": "body", "parameters": [{"type": "text", "text": label}]},
                  {"type": "button", "sub_type": "url", "index": "0",
                   "parameters": [{"type": "text", "text": url_suffix}]}
                ]
              }
            })

          # Neues Template (Info-Text ohne Links + 3 eigene Nachrichten mit echtem Button)
          # versuchen, bei Meta evtl. noch nicht freigegeben -> dann auf die bewaehrte
          # Text-Link-Version zurueckfallen, damit immer ein Weg zum Handeln da ist.
          r_info = req.post(msg_api, headers=auth_headers, json={
            "messaging_product": "whatsapp",
            "to": wa_to,
            "type": "template",
            "template": {
              "name": "blog_entwurf_info_v2",
              "language": {"code": "de"},
              "components": [{"type": "body", "parameters": [
                {"type": "text", "text": title},
                {"type": "text", "text": date_de},
                {"type": "text", "text": excerpt or "(keine Zusammenfassung verfügbar)"},
                {"type": "text", "text": fb_preview or "(kein Facebook-Text verfügbar)"},
                {"type": "text", "text": ig_preview or "(kein Instagram-Text verfügbar)"},
              ]}]
            }
          })
          print(f"Info-Nachricht Status: {r_info.status_code}")
          if r_info.status_code >= 300:
            print(f"  {r_info.text[:300]}")

          if r_info.status_code < 300:
            for label, suffix in [
              ("✅ Freigeben & veröffentlichen", f"approve?token={approve_tok}"),
              ("🖼️ Neues Bild vorschlagen", f"suggest-image?token={approve_tok}"),
              ("✏️ Änderung beantragen (Titel/Text ändern)", f"change?token={approve_tok}"),
            ]:
              r_btn = sende_aktion_button(label, suffix)
              print(f"Aktion '{label}': {r_btn.status_code}")
              if r_btn.status_code >= 300:
                print(f"  Fehler: {r_btn.text[:200]}")
            r = r_info
          else:
            print(f"  blog_entwurf_info noch nicht nutzbar: {r_info.text[:200]} – falle auf altes Template zurueck.")
            r = sende_freigabe("blog_entwurf_freigabe_v2", mit_summary=True)
            if r.status_code >= 300:
              print(f"blog_entwurf_freigabe_v2 noch nicht nutzbar ({r.status_code}: {r.text[:200]}) – falle auf v1 zurueck.")
              r = sende_freigabe("blog_entwurf_freigabe", mit_summary=False)

          print(f"WhatsApp Status: {r.status_code}")
          if r.status_code >= 300:
            print(f"Fehler: {r.text[:500]}")
            sys.exit(1)
          PYEOF
