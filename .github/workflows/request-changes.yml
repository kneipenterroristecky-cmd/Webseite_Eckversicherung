name: 3 – Änderung am Blog-Entwurf beantragen

on:
  workflow_dispatch:
    inputs:
      new_topic:
        description: 'Komplett neues Thema generieren (z.B. "Hausratversicherung: Was wirklich versichert ist"). Leer = Thema bleibt.'
        required: false
        default: ''
      new_unsplash_id:
        description: 'Neues Bild – Unsplash Foto-ID (z.B. photo-1552664730-d307ca884978). Leer = kein Bildwechsel.'
        required: false
        default: ''
      new_title:
        description: 'Neuer Beitragstitel. Leer = Titel bleibt.'
        required: false
        default: ''
      new_summary:
        description: 'Neuer Facebook/Instagram-Text. Leer = Text bleibt.'
        required: false
        default: ''
      suggest_new_image:
        description: 'Automatisch ein neues passendes Bild vorschlagen (überschreibt Foto-ID oben)'
        required: false
        type: boolean
        default: false

jobs:
  aendern:
    name: Entwurf anpassen und neu rendern
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install requests playwright pillow anthropic

      - name: Neues Thema generieren
        if: ${{ inputs.new_topic != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          FORCE_TOPIC: ${{ inputs.new_topic }}
        run: |
          playwright install chromium --with-deps
          python tools/generate_post.py
          python tools/generate_social_image.py

      - name: Änderungen anwenden
        if: ${{ inputs.new_topic == '' }}
        env:
          NEW_UNSPLASH_ID: ${{ inputs.new_unsplash_id }}
          NEW_TITLE: ${{ inputs.new_title }}
          NEW_SUMMARY: ${{ inputs.new_summary }}
          SUGGEST_IMAGE: ${{ inputs.suggest_new_image }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys, requests as req
          sys.path.insert(0, 'tools')
          from image_search import find_best_image
          if not os.path.exists('tools/draft_meta.json'):
            print("Kein Entwurf gefunden – zuerst Workflow 1 ausfuehren.")
            sys.exit(1)
          meta = json.load(open('tools/draft_meta.json', encoding='utf-8'))
          html_path = f"blog/posts/{meta['filename']}"
          if not os.path.exists(html_path):
            print(f"Entwurf '{meta['filename']}' existiert nicht mehr (bereits veroeffentlicht oder zurueckgezogen) – zuerst Workflow 1 ausfuehren.")
            sys.exit(1)
          blog_html = open(html_path, encoding='utf-8').read()
          changed = []
          new_id       = os.environ.get('NEW_UNSPLASH_ID', '').strip()
          new_title    = os.environ.get('NEW_TITLE', '').strip()
          new_summary  = os.environ.get('NEW_SUMMARY', '').strip()
          suggest      = os.environ.get('SUGGEST_IMAGE', '').lower() == 'true'
          unsplash_key = os.environ.get('UNSPLASH_ACCESS_KEY', '').strip()
          anthropic_key_img = os.environ.get('ANTHROPIC_API_KEY', '').strip()
          if suggest and not new_id:
            if not unsplash_key or not anthropic_key_img:
              print("⚠️  UNSPLASH_ACCESS_KEY oder ANTHROPIC_API_KEY nicht gesetzt – Bildvorschlag uebersprungen.")
            else:
              try:
                import anthropic as ac
                img_client = ac.Anthropic(api_key=anthropic_key_img)
                # Aktuellen Titel (ggf. neuer Titel aus diesem Lauf) als Suchgrundlage nehmen,
                # nicht die veraltete unsplash_query aus dem urspruenglichen Entwurf.
                topic_title = new_title or meta.get('title', '')
                fallback = meta.get('og_image') or "https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=1200&h=630&fit=crop&auto=format"
                current_match = re.search(r'(photo-[\w-]+)', meta.get('og_image', ''))
                current_id = current_match.group(1) if current_match else None
                new_id = find_best_image(
                  topic_title, meta.get('label', 'Ratgeber'),
                  meta.get('unsplash_query', topic_title),
                  img_client, fallback, unsplash_key,
                  exclude_id=current_id
                )
              except Exception as e:
                print(f"⚠️  Bildauswahl-Fehler: {e}")
          if new_id:
            new_url = new_id if new_id.startswith('https://') else f"https://images.unsplash.com/{new_id}?w=1200&h=630&fit=crop&auto=format"
            meta['og_image'] = new_url
            blog_html = re.sub(
              r'<meta property="og:image" content="[^"]*"',
              f'<meta property="og:image" content="{new_url}"', blog_html)
            blog_html = re.sub(
              r'<img([^>]*?)src="[^"]*"([^>]*?)class="blog-hero-img"',
              f'<img\\1src="{new_url}"\\2class="blog-hero-img"', blog_html)
            ig_url = re.sub(r'w=\d+&h=\d+', 'w=1080&h=1920', new_url)
            for sf in ['social/latest-ig.html', 'social/latest-ig-heiko.html', 'social/latest-ig-beide.html']:
              if os.path.exists(sf):
                s = open(sf, encoding='utf-8').read()
                s = re.sub(r'(<img class="bg-img" src=")[^"]+(")', fr'\g<1>{ig_url}\g<2>', s)
                open(sf, 'w', encoding='utf-8').write(s)
            changed.append("Bild aktualisiert")
          if new_title:
            old = meta['title']
            meta['title'] = new_title
            blog_html = re.sub(
              r'<meta property="og:title" content="[^"]*"',
              f'<meta property="og:title" content="{new_title}"', blog_html)
            blog_html = re.sub(r'<title>[^<]*</title>',
              f'<title>{new_title} | Daniel Eck - Versicherungsmakler</title>', blog_html)
            blog_html = blog_html.replace(f'>{old}<', f'>{new_title}<', 2)
            h1_html = f'<h1>{new_title}</h1>'
            anthropic_key = os.environ.get('ANTHROPIC_API_KEY', '').strip()
            if anthropic_key:
              try:
                import anthropic as ac
                client = ac.Anthropic(api_key=anthropic_key)
                msg = client.messages.create(
                  model="claude-haiku-4-5-20251001",
                  max_tokens=150,
                  messages=[{"role": "user", "content":
                    f'Formatiere diesen Blog-Titel als HTML h1 fuer ein Instagram-Bild. '
                    f'Titel: "{new_title}". '
                    f'Waehle das wichtigste Hauptwort (1-2 Woerter) und umschliesse es mit <span>. '
                    f'Setze sinnvolle <br>-Umbrueche (max 3 Zeilen, je ~3-4 Woerter). '
                    f'Antworte NUR mit dem h1-Tag. Beispiel: <h1>Fuer Ihre<br><span>Familie</span><br>abgesichert</h1>'}]
                )
                h1_html = msg.content[0].text.strip()
                print(f"h1 generiert: {h1_html}")
              except Exception as e:
                print(f"⚠️ h1-Formatierung fehlgeschlagen: {e}")
            for sf in ['social/latest-ig.html', 'social/latest-ig-heiko.html', 'social/latest-ig-beide.html']:
              if os.path.exists(sf):
                s = open(sf, encoding='utf-8').read()
                s = re.sub(r'<h1>.*?</h1>', h1_html, s, flags=re.DOTALL)
                open(sf, 'w', encoding='utf-8').write(s)
            changed.append(f"Titel -> {new_title}")
          if new_summary:
            meta['social_summary'] = new_summary
            meta['instagram_caption'] = new_summary
            changed.append("Social-Text aktualisiert")
          open(html_path, 'w', encoding='utf-8').write(blog_html)
          json.dump(meta, open('tools/draft_meta.json', 'w', encoding='utf-8'),
            ensure_ascii=False, indent=2)
          print("Aenderungen:", ', '.join(changed) if changed else "keine")
          PYEOF

      - name: Playwright Chromium installieren
        if: ${{ inputs.new_topic == '' && (inputs.new_unsplash_id != '' || inputs.suggest_new_image == true || inputs.new_title != '') }}
        run: playwright install chromium --with-deps

      - name: Social-Bild neu rendern
        if: ${{ inputs.new_topic == '' && (inputs.new_unsplash_id != '' || inputs.suggest_new_image == true || inputs.new_title != '') }}
        run: python tools/generate_social_image.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git stash --include-untracked
            STASHED=1
          else
            STASHED=0
          fi
          git pull --rebase origin master
          if [ "$STASHED" -eq 1 ]; then
            git stash pop
          fi
          git add blog/posts/ tools/draft_meta.json social/
          TITLE=$(python3 -c "import json; print(json.load(open('tools/draft_meta.json'))['title'])")
          git diff --staged --quiet || git commit -m "Entwurf geaendert: $TITLE"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push-Versuch $i fehlgeschlagen, warte 15 Sekunden..."
            sleep 15
          done

      - name: Metadaten und Issue-URL vorbereiten
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os
          m = json.load(open('tools/draft_meta.json', encoding='utf-8'))
          summary = m.get('social_summary', '')[:300].replace('\n', ' ')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"POST_TITLE={m['title']}\n")
              f.write(f"POST_DATE={m.get('date_de', '')}\n")
              f.write(f"POST_SUMMARY={summary}\n")
          PYEOF
          ISSUE_NUM=$(gh issue list --state open --json number,title \
            --jq '[.[] | select(.title | startswith("📝 Blog-Entwurf"))] | .[0].number' 2>/dev/null || echo "")
          if [ -n "$ISSUE_NUM" ] && [ "$ISSUE_NUM" != "null" ]; then
            echo "ISSUE_URL=https://github.com/${GITHUB_REPOSITORY}/issues/${ISSUE_NUM}" >> $GITHUB_ENV
            echo "ISSUE_NUM=$ISSUE_NUM" >> $GITHUB_ENV
          else
            echo "ISSUE_URL=https://github.com/${GITHUB_REPOSITORY}/issues" >> $GITHUB_ENV
            echo "ISSUE_NUM=" >> $GITHUB_ENV
          fi
          echo "APPROVE_URL=https://github.com/${GITHUB_REPOSITORY}/actions/workflows/publish-blog-post.yml" >> $GITHUB_ENV
          echo "CHANGE_URL=https://github.com/${GITHUB_REPOSITORY}/actions/workflows/request-changes.yml" >> $GITHUB_ENV

      - name: Issue-Kommentar mit Änderungsprotokoll
        if: ${{ env.ISSUE_NUM != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED=""
          [ -n "${{ inputs.new_unsplash_id }}" ] && CHANGED="$CHANGED\n- 🖼️ Bild geändert: \`${{ inputs.new_unsplash_id }}\`"
          [ -n "${{ inputs.new_title }}" ]       && CHANGED="$CHANGED\n- 📝 Titel: ${{ inputs.new_title }}"
          [ -n "${{ inputs.new_summary }}" ]     && CHANGED="$CHANGED\n- 💬 Social-Text aktualisiert"
          printf "✏️ **Entwurf angepasst:**%b\n\n📬 Neue Vorschau-E-Mail wurde gesendet." "$CHANGED" \
            | gh issue comment "$ISSUE_NUM" --body-file -

      - name: Aktualisierte Vorschau per WhatsApp senden
        env:
          WA_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WA_TO: ${{ secrets.WHATSAPP_TO_NUMBER }}
          APPROVE_WORKER_URL: ${{ secrets.APPROVE_WORKER_URL }}
          APPROVE_TOKEN: ${{ secrets.APPROVE_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, json, requests as req, sys

          def trunc(s, n):
            """Kuerzt an der letzten Wortgrenze statt hart mitten im Wort abzuschneiden."""
            s = (s or "").replace("\n", " ").strip()
            if len(s) <= n:
              return s
            cut = s[:n].rsplit(" ", 1)[0].rstrip(",.;:–-")
            return cut + "…"

          def full(s):
            """Nie abschneiden - die KI begrenzt blog_excerpt/wa_image_text schon selbst kurz genug."""
            return (s or "").replace("\n", " ").strip()

          meta    = json.load(open("tools/draft_meta.json", encoding="utf-8"))
          title   = meta.get("title", "")
          date_de = meta.get("date_de", "")
          # WhatsApp-Template-Parameter duerfen KEINE Zeilenumbrueche enthalten (Meta lehnt den
          # Versand sonst mit Fehler 132018 ab) - deshalb excerpt/fb/ig als 3 GETRENNTE Parameter
          # (jeweils eigene Zeile im STATISCHEN Vorlagentext, nicht im Parameterwert selbst).
          excerpt    = full(meta.get("blog_excerpt", ""))
          image_text = full(meta.get("wa_image_text", ""))
          fb_preview = trunc(meta.get("social_summary", ""), 170)
          ig_preview = trunc(meta.get("instagram_caption", "").split("\n\n")[0], 170)
          # Fallback fuer das alte kombinierte Template: nur solange nutzen, bis blog_entwurf_info_v3
          # freigegeben ist. Dort ist wegen der 3 mit reingepackten Link-URLs nicht genug Platz fuer
          # excerpt+FB+IG komplett - FB/IG muessen laut Vorgabe VOLLSTAENDIG erscheinen, deshalb faellt
          # hier der Excerpt weg statt FB/IG anzuschneiden.
          summary = f"📘 Facebook: {fb_preview} • 📸 Instagram: {ig_preview}"
          og_image = meta.get("og_image", "")

          repo        = os.environ.get("GITHUB_REPOSITORY", "")
          worker_url  = os.environ.get("APPROVE_WORKER_URL", "").strip().rstrip("/")
          approve_tok = os.environ.get("APPROVE_TOKEN", "").strip()
          if worker_url and approve_tok:
            approve_url      = f"{worker_url}/approve?token={approve_tok}"
            change_url       = f"{worker_url}/change?token={approve_tok}"
            suggest_img_url  = f"{worker_url}/suggest-image?token={approve_tok}"
          else:
            approve_url      = f"https://github.com/{repo}/actions/workflows/publish-blog-post.yml"
            change_url       = f"https://github.com/{repo}/actions/workflows/request-changes.yml"
            suggest_img_url  = change_url

          token    = os.environ.get("WA_TOKEN", "").strip()
          phone_id = os.environ.get("WA_PHONE_ID", "").strip()
          wa_to    = os.environ.get("WA_TO", "").strip()
          if not all([token, phone_id, wa_to]):
            print("❌ Fehlende WhatsApp-Secrets!"); sys.exit(1)

          msg_api = f"https://graph.facebook.com/v19.0/{phone_id}/messages"
          auth_headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          if og_image:
            img_r = req.get(og_image, timeout=20, headers={"User-Agent": "Mozilla/5.0"})
            if img_r.ok:
              up = req.post(f"https://graph.facebook.com/v19.0/{phone_id}/media",
                headers={"Authorization": f"Bearer {token}"},
                data={"messaging_product": "whatsapp"},
                files={"file": ("vorschau.jpg", img_r.content, img_r.headers.get("content-type", "image/jpeg"))})
              media_id = up.json().get("id") if up.status_code < 300 else None
              print(f"Vorschau-Bild Upload: {up.status_code}{' (' + str(len(img_r.content)//1024) + ' KB)' if media_id else ' ' + up.text[:200]}")
              if media_id:
                r_img = req.post(msg_api, headers=auth_headers, json={
                  "messaging_product": "whatsapp",
                  "to": wa_to,
                  "type": "template",
                  "template": {
                    "name": "social_bild",
                    "language": {"code": "de"},
                    "components": [{"type": "header", "parameters": [
                      {"type": "image", "image": {"id": media_id}}
                    ]}]
                  }
                })
                print(f"Vorschau-Bild Status: {r_img.status_code}")
                if r_img.status_code >= 300:
                  print(f"  (kein Abbruch) Fehler: {r_img.text[:300]}")
            else:
              print(f"Vorschau-Bild Download fehlgeschlagen: {img_r.status_code}")

          def sende_aktualisiert(template_name, mit_summary):
            params = [
              {"type": "text", "text": title},
              {"type": "text", "text": date_de},
            ]
            if mit_summary:
              params.append({"type": "text", "text": summary})
            params += [
              {"type": "text", "text": approve_url},
              {"type": "text", "text": suggest_img_url},
              {"type": "text", "text": change_url},
            ]
            return req.post(msg_api, headers=auth_headers, json={
              "messaging_product": "whatsapp",
              "to": wa_to,
              "type": "template",
              "template": {
                "name": template_name,
                "language": {"code": "de"},
                "components": [{"type": "body", "parameters": params}]
              }
            })

          def sende_aktion_button(label, url_suffix):
            return req.post(msg_api, headers=auth_headers, json={
              "messaging_product": "whatsapp",
              "to": wa_to,
              "type": "template",
              "template": {
                "name": "blog_aktion",
                "language": {"code": "de"},
                "components": [
                  {"type": "body", "parameters": [{"type": "text", "text": label}]},
                  {"type": "button", "sub_type": "url", "index": "0",
                   "parameters": [{"type": "text", "text": url_suffix}]}
                ]
              }
            })

          r_info = req.post(msg_api, headers=auth_headers, json={
            "messaging_product": "whatsapp",
            "to": wa_to,
            "type": "template",
            "template": {
              "name": "blog_entwurf_info_v3",
              "language": {"code": "de"},
              "components": [{"type": "body", "parameters": [
                {"type": "text", "text": title},
                {"type": "text", "text": date_de},
                {"type": "text", "text": excerpt or "(keine Zusammenfassung verfügbar)"},
                {"type": "text", "text": image_text or "(kein Bildtext verfügbar)"},
                {"type": "text", "text": fb_preview or "(kein Facebook-Text verfügbar)"},
                {"type": "text", "text": ig_preview or "(kein Instagram-Text verfügbar)"},
              ]}]
            }
          })
          print(f"Info-Nachricht Status: {r_info.status_code}")
          if r_info.status_code >= 300:
            print(f"  {r_info.text[:300]}")

          if r_info.status_code < 300:
            for label, suffix in [
              ("✅ Freigeben & veröffentlichen", f"approve?token={approve_tok}"),
              ("🖼️ Neues Bild vorschlagen", f"suggest-image?token={approve_tok}"),
              ("✏️ Nochmal ändern", f"change?token={approve_tok}"),
            ]:
              r_btn = sende_aktion_button(label, suffix)
              print(f"Aktion '{label}': {r_btn.status_code}")
              if r_btn.status_code >= 300:
                print(f"  Fehler: {r_btn.text[:200]}")
            r = r_info
          else:
            print(f"  blog_entwurf_info noch nicht nutzbar: {r_info.text[:200]} – falle auf altes Template zurueck.")
            r = sende_aktualisiert("blog_entwurf_aktualisiert_v2", mit_summary=True)
            if r.status_code >= 300:
              print(f"blog_entwurf_aktualisiert_v2 noch nicht nutzbar ({r.status_code}: {r.text[:200]}) – falle auf v1 zurueck.")
              r = sende_aktualisiert("blog_entwurf_aktualisiert", mit_summary=False)

          print(f"WhatsApp Status: {r.status_code}")
          if r.status_code >= 300:
            print(f"Fehler: {r.text[:500]}")
            sys.exit(1)
          PYEOF
